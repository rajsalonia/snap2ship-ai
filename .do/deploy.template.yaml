spec:
  name: snap2ship-ai
  region: blr
  static_sites:
    - name: studio
      git:
        repo_clone_url: https://github.com/rajsalonia/snap2ship-ai.git
        branch: digitalocean-free-20261026
      source_dir: /frontend
      environment_slug: node-js
      build_command: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      output_dir: dist
      index_document: index.html
      catchall_document: index.html
      envs:
        - key: VITE_API_URL
          value: https://snap2ship-ai-api.onrender.com
          scope: BUILD_TIME
  ingress:
    rules:
      - match:
          path:
            prefix: /
        component:
          name: studio
