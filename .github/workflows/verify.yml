name: Verify Snap2Ship
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-and-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/template-runtime/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend/template-runtime
      - run: python -m pytest -q
        working-directory: backend
      - run: python scripts/compile_samples.py
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --tag snap2ship-ci .
      - run: docker run --rm --entrypoint sh snap2ship-ci -c 'node --version && python -c "import main; assert main.compiler_available(); assert main.frontend_dist.is_dir()"'
